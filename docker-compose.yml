services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shopwright
      POSTGRES_PASSWORD: shopwright
      POSTGRES_DB: shopwright
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwright"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  dbdata:
